enable-magisk-update = true
parallel-jobs = 1

[YouTube]
apkmirror-dlurl = "https://apkmirror.com/apk/google-inc/youtube/"
patches-source = "anddea/revanced-patches"
rv-brand = "anddea ReVanced"
patches-version = "v3.11.0-dev.1"
arch = "arm64-v8a"
build-mode = "module"
excluded-patches = "'GmsCore support'"
patcher-args = "-e 'Custom branding icon for YouTube' -OappIcon=revancify_blue -OrestoreOldSplashAnimation=true -e 'Custom header for YouTube' -OcustomHeader=custom_branding_icon"
integrations-source = "inotia00/revanced-integrations"
cli-source = "inotia00/revanced-cli"
